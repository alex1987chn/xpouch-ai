name: 🐛 Bug 报告
description: 报告一个问题帮助我们改进
labels: ['bug']
body:
  - type: markdown
    attributes:
      value: 感谢反馈！请尽量填写以下信息，能极大加快定位速度。
  - type: textarea
    id: what-happened
    attributes:
      label: 发生了什么？
      description: 描述问题现象与期望行为（截图/日志欢迎粘贴）
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤
      placeholder: |
        1. 打开 …
        2. 点击 …
        3. 出现 …
    validations:
      required: true
  - type: dropdown
    id: deploy
    attributes:
      label: 部署方式
      options:
        - Docker Compose
        - 本地开发（pnpm dev + run.py）
        - 生产自部署
        - xpouch.ai 在线版
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: 版本
      description: 侧边栏左下角可见（如 v3.4.5）
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 相关日志
      description: 后端控制台 / 浏览器 Console 的报错（如有）
      render: shell
