name: 💡 功能建议
description: 提出一个新功能或改进想法
labels: ['enhancement']
body:
  - type: textarea
    id: problem
    attributes:
      label: 你想解决什么问题？
      description: 描述使用场景，而不是直接给方案（方案写在下一栏）
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: 期望的解决方式
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案 / 现有绕过方式
  - type: checkboxes
    id: checklist
    attributes:
      label: 确认
      options:
        - label: 我已搜索过现有 issue，没有重复建议
          required: true
