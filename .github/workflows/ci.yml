name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

# 同分支新推送取消进行中的旧 run，省额度
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-check:
    name: Backend Checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ./backend

    services:
      postgres:
        image: pgvector/pgvector:pg18-bookworm
        env:
          POSTGRES_USER: xpouch_test
          POSTGRES_PASSWORD: test_pass
          POSTGRES_DB: xpouch_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.6.x"
          enable-cache: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # T2 OpenAPI 闸门需要 node 拉起 openapi-typescript（系统临时目录隔离工具目录）
      - name: Setup Node.js (for OpenAPI type gate)
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run Ruff check
        run: uv run ruff check .

      - name: Run all backend tests (with coverage)
        env:
          # 使用 CI 服务中的 PostgreSQL（**空库**：测试不得依赖 schema）
          DATABASE_URL: postgresql+psycopg://xpouch_test:test_pass@localhost:5432/xpouch_test
          # Mock API keys for tests
          DEEPSEEK_API_KEY: test-key
          MOONSHOT_API_KEY: test-key
          SILICON_API_KEY: test-key
          JWT_SECRET_KEY: test-secret-key-for-ci-only
          ENVIRONMENT: development
        run: |
          uv pip install pytest-cov
          uv run pytest tests/ --cov=. --cov-report=term --cov-report=xml

      - name: Apply the migration chain to an empty database
        env:
          # 独立库：整套迁移从零 apply 一遍。CI 此前从不跑迁移，于是
          # 「迁移链在空库上跑不通」只能等上线才暴露（生产已中过两次：
          # OTP 列宽收窄、subtask.input_data 缺迁移）。
          DATABASE_URL: postgresql+psycopg://xpouch_test:test_pass@localhost:5432/xpouch_migrations
        run: |
          PGPASSWORD=test_pass psql -h localhost -U xpouch_test -d xpouch_test \
            -c "CREATE DATABASE xpouch_migrations;"
          uv run alembic upgrade head

      - name: Detect model/schema drift (alembic check)
        # 评审 M1：autogenerate diff 空转检查——模型与迁移库不一致时当场报出
        # （新增列忘写迁移这类事故此前只有上线才暴露）。
        # 2026-09-14 漂移已清零（索引命名统一 idx_*、user_settings 已建模、
        # 可空性/外键对齐），闸门转为阻塞。前置：models/__init__.py 顶部设置了
        # SQLModel.metadata 命名约定，env.py 导入了全部模型——这两处动过必挂。
        env:
          DATABASE_URL: postgresql+psycopg://xpouch_test:test_pass@localhost:5432/xpouch_migrations
        run: uv run alembic check

      - name: Run backend tests again against the migrated schema
        env:
          # 本地日常跑的是「迁移过的库」，这里对齐同一口径。
          # 两遍都跑，才能让「只在一边过」的偏差（例如本地绿、CI 空库红那条
          # toolpolicy 依赖）在同一次 CI 里现形，而不是等推上去才发现。
          DATABASE_URL: postgresql+psycopg://xpouch_test:test_pass@localhost:5432/xpouch_migrations
          DEEPSEEK_API_KEY: test-key
          MOONSHOT_API_KEY: test-key
          SILICON_API_KEY: test-key
          JWT_SECRET_KEY: test-secret-key-for-ci-only
          ENVIRONMENT: development
        run: uv run pytest tests/ -q

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage.xml
          retention-days: 14

  frontend-check:
    name: Frontend Checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

  docker-build:
    name: Docker Build Verification
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build backend image
        # --build-context repo=. 与 docker-compose.yml 的 additional_contexts 对应：
        # backend/Dockerfile 里 COPY --from=repo NOTICE 依赖该附加上下文
        run: docker build --build-context repo=. -t xpouch-backend-ci ./backend

      - name: Build frontend image
        run: docker build -f frontend/Dockerfile -t xpouch-frontend-ci .
