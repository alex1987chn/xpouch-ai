services:
  # PostgreSQL 数据库服务 (带 pgvector 插件，支持向量检索)
  db:
    # 使用 pgvector 镜像，PG 18
    image: pgvector/pgvector:pg18-bookworm
    container_name: xpouch-postgres
    restart: always
    # 宿主机侧端口映射可通过根 .env 的 POSTGRES_PORT_MAPPING 覆盖：
    # - 本地开发默认 5432:5432（本机工具直连）
    # - 生产由 deploy.sh 强制默认 127.0.0.1:5432:5432（仅容器/本机可达，不对公网开放）
    ports:
      - "${POSTGRES_PORT_MAPPING:-5432:5432}"
    volumes:
      # PG 18+ 新格式：挂载到 /var/lib/postgresql（非 data 子目录）
      - ./postgres_data:/var/lib/postgresql
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  # 后端服务
  backend:
    build: ./backend
    # build+image 同设：构建产物以 GIT_VERSION（git 短 SHA，deploy.sh 注入）打标签，
    # 旧版本镜像保留可回滚；本地 compose 不设 GIT_VERSION 时退回 local 标签
    image: xpouch-ai-backend:${GIT_VERSION:-local}
    container_name: xpouch-backend
    restart: always
    env_file:
      - ./backend/.env
    environment:
      # 容器内后端固定监听 3000；本地直跑 backend/main.py 时可使用 backend/.env 中的 3002
      - PORT=3000
      # Docker Compose 场景下由 compose 显式注入数据库连接，避免与 backend/.env 形成歧义
      - DATABASE_URL=postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      # 容器内应用级健康检查（Dockerfile HEALTHCHECK 的编排侧兜底）
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:3000/api/health', timeout=3).status==200 else 1)\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    networks:
      - app-network

  # 前端服务
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    image: xpouch-ai-frontend:${GIT_VERSION:-local}
    container_name: xpouch-frontend
    restart: always
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - app-network

# 说明：PG 数据使用 bind mount（./postgres_data），无需具名卷。
# 该顶层 volumes 声明曾与实际挂载不一致（具名卷从未被引用），已移除。

networks:
  app-network:
    driver: bridge
