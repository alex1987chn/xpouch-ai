# ============================================================================
# LLM 提供商配置文件
# ============================================================================
# 说明：
# - 此文件只包含非敏感配置（base_url、模型名、默认参数）
# - API Key 必须在 .env 文件中设置（通过 env_key 指定变量名）
# - 添加新提供商只需在此文件添加配置，无需修改代码
# - 此文件会提交到 git，请勿包含任何敏感信息！
# ============================================================================

providers:
  # -------------------------------------------------------------------------
  # MiniMax - 已停用（2026-09）：余额耗尽且生成质量一般，全面切换 DeepSeek
  # 文档: https://platform.minimaxi.com/docs/api-reference/text-openai-api
  # 注意: MiniMax 是 OpenAI 兼容 API，经测试 ToolMessage content 为 list 时会报错，
  #       因此使用 string 模式将 content 转为 JSON 字符串
  # 恢复方法：改回 enabled: true，并在 .env 中配置 MINIMAX_API_KEY
  # -------------------------------------------------------------------------
  minimax:
    name: MiniMax
    base_url: https://api.minimaxi.com/v1   # OpenAI 兼容 API
    env_key: MINIMAX_API_KEY                # .env 中的环境变量名
    default_model: MiniMax-M2.1             # MiniMax M2.1 (支持 OpenAI 兼容 API)
    temperature: 0.1                        # Router 用低温度
    context_window: 1000000
    priority: 1                             # Router 优先级（数字越小越优先）
    enabled: false                          # 2026-09 停用：余额耗尽、效果一般
    content_mode: string                    # ToolMessage content 转为 JSON 字符串

  # -------------------------------------------------------------------------
  # DeepSeek - 性价比高，通用对话
  # 注意: DeepSeek Chat API 目前 ToolMessage content 为 list 时会报错，
  #       因此使用 string 模式。后续如果支持多模态可改为 auto
  # -------------------------------------------------------------------------
  deepseek:
    name: DeepSeek
    base_url: https://api.deepseek.com/v1
    env_key: DEEPSEEK_API_KEY
    default_model: deepseek-v4-flash        # DeepSeek V4 Flash（旧别名 deepseek-chat 已于 2026-07-24 停用）
    temperature: 0.7
    max_tokens: 32768                       # V4 输出上限 384K；不显式设置时 API 默认值偏小，长 HTML artifact 会被静默截断
    context_window: 1000000                 # V4 Flash 支持 1M 上下文
    priority: 1
    enabled: true
    content_mode: string                    # ToolMessage content 转为 JSON 字符串
    extra_body:
      thinking:
        type: disabled                      # V4 默认开启思考模式；关闭以保持与旧 deepseek-chat 行为一致（更快、更省）

  # -------------------------------------------------------------------------
  # OpenAI - GPT 系列，代码和复杂任务
  # 支持多模态 content (list[str | dict])
  # -------------------------------------------------------------------------
  openai:
    name: OpenAI
    base_url: https://api.openai.com/v1
    env_key: OPENAI_API_KEY
    default_model: gpt-4o
    temperature: 0.7
    context_window: 128000
    priority: 3
    enabled: false                           # 未配置 OPENAI_API_KEY，禁用
    content_mode: auto                       # 原生支持多模态 content，无需转换

  # -------------------------------------------------------------------------
  # Anthropic - Claude 系列，长文本和研究
  # 支持多模态 content (list[str | dict])
  # -------------------------------------------------------------------------
  anthropic:
    name: Anthropic
    base_url: https://api.anthropic.com/v1
    env_key: ANTHROPIC_API_KEY
    default_model: claude-sonnet-4-20250514
    temperature: 0.7
    context_window: 200000
    priority: 4
    enabled: false                           # 默认不启用，需配置 API Key
    content_mode: auto                       # 原生支持多模态 content，无需转换

  # -------------------------------------------------------------------------
  # Google - Gemini 系列，多模态
  # 支持多模态 content (list[str | dict])
  # -------------------------------------------------------------------------
  google:
    name: Google
    base_url: https://generativelanguage.googleapis.com/v1
    env_key: GOOGLE_API_KEY
    default_model: gemini-2.0-flash-exp
    temperature: 0.7
    context_window: 1048576
    priority: 5
    enabled: false
    content_mode: auto                       # 原生支持多模态 content，无需转换

  # -------------------------------------------------------------------------
  # Moonshot (月之暗面) - Kimi K2.6，便宜快速的通用模型，支持文本/图像输入
  # 注：kimi-k2.5 该 API Key 无权限（2026-09 实测 404），已切换 K2.6 并保留旧 ID 别名；
  #     K2.6 默认开启思考模式，extra_body 关闭以保持快/省（与 DeepSeek 配置约定一致）
  # -------------------------------------------------------------------------
  moonshot:
    name: Moonshot
    base_url: https://api.moonshot.cn/v1
    env_key: MOONSHOT_API_KEY
    default_model: kimi-k2.6
    temperature: 0.6                        # K2.6 仅允许 temperature=0.6（实测 400: only 0.6 is allowed）
    max_tokens: 32768                       # 与官方默认一致（32K），显式设置防止历史默认回落（K2 曾默认 1024）
    context_window: 256000
    priority: 6
    enabled: true
    content_mode: auto                      # Kimi 支持多模态，原生接受 list[str|dict]
    extra_body:
      thinking:
        type: disabled                      # K2.6 默认开思考；关闭以更快更省（实测 thinking.type 参数有效）

# ============================================================================
# 嵌入模型配置（用于长期记忆系统）
# ============================================================================
# 说明：
# - 嵌入模型用于向量化用户记忆
# - API Key 必须在 .env 文件中设置（通过 env_key 指定）
# - 此文件会提交到 git，请勿包含任何敏感信息！
# ============================================================================

embeddings:
  # -------------------------------------------------------------------------
  # SiliconFlow - 推荐，提供免费 BAAI/bge-m3 模型
  # 文档: https://docs.siliconflow.cn/docs/get-started/quickstart
  # -------------------------------------------------------------------------
  siliconflow:
    name: SiliconFlow
    base_url: https://api.siliconflow.cn/v1
    env_key: SILICON_API_KEY
    default_model: BAAI/bge-m3
    dimensions: 1024  # 向量维度（必须与数据库表定义一致）
    enabled: true

# 默认使用的嵌入提供商
default_provider: siliconflow

# ============================================================================
# 模型别名映射（用于前端展示和后端调用）
# ============================================================================
models:
  # MiniMax - 已停用（2026-09），别名保留以兼容数据库中已存储的旧模型 ID
  # minimax-m2.1:
  #   provider: minimax
  #   model: MiniMax-M2.1
  #   name: MiniMax M2.1

  # 大写别名（兼容数据库中存储的格式）
  # MiniMax-M2.1:
  #   provider: minimax
  #   model: MiniMax-M2.1
  #   name: MiniMax M2.1

  # 其他常见变体
  # MiniMax-M2-1:
  #   provider: minimax
  #   model: MiniMax-M2.1
  #   name: MiniMax M2.1

  # DeepSeek - V4 Flash（旧 ID deepseek-chat/deepseek-reasoner 已于 2026-07-24 停用，
  # 保留映射仅为兼容数据库中已存储的旧模型 ID）
  deepseek-v4-flash:
    provider: deepseek
    model: deepseek-v4-flash
    name: DeepSeek V4 Flash
    thinking_toggle: true                # 支持思考模式开关（请求级 thinking.type 覆盖）

  # 兼容别名（hidden: 不出现在 /api/models 可选列表中）
  deepseek-chat:
    provider: deepseek
    model: deepseek-v4-flash
    name: DeepSeek V4 Flash
    hidden: true

  deepseek-reasoner:
    provider: deepseek
    model: deepseek-v4-flash
    name: DeepSeek V4 Flash
    hidden: true
    
  # OpenAI
  gpt-4o:
    provider: openai
    model: gpt-4o
    name: GPT-4o
    
  gpt-4o-mini:
    provider: openai
    model: gpt-4o-mini
    name: GPT-4o Mini
    
  gpt-4-turbo:
    provider: openai
    model: gpt-4-turbo
    name: GPT-4 Turbo

  # Moonshot (月之暗面)
  kimi-k2.6:
    provider: moonshot
    model: kimi-k2.6
    name: Kimi K2.6
    temperature: 0.6                     # K2.6 仅允许 0.6（同旧 K2.5 仅允许 1 的限制）
    thinking_toggle: true                # 思考开关参数实测有效（thinking.type，同 DeepSeek 约定）

  # Kimi K3 旗舰（贵但强，按需在专家中指定）
  kimi-k3:
    provider: moonshot
    model: kimi-k3
    name: Kimi K3

  # 兼容别名：kimi-k2.5（该 Key 无权限已不可用，映射到 K2.6，hidden 不出现在可选列表）
  kimi-k2.5:
    provider: moonshot
    model: kimi-k2.6
    name: Kimi K2.6
    temperature: 0.6
    hidden: true

# ============================================================================
# Router 节点配置
# ============================================================================
router:
  # 优先级列表（按顺序尝试）
  # 注意：MiniMax-Text-01 输出包含 <think> 标签，不适合需要 JSON 输出的 Router
  # 所以 Router 优先使用 DeepSeek（输出干净，适合 JSON 解析）
  # 2026-09：MiniMax 已停用，从列表移除
  priority_providers:
    - deepseek
    - openai
  
  # Router 专用参数
  temperature: 0.1
  streaming: true
